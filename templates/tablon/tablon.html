{% load static %}

<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- Estilo water.css -->
	<link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
	<title>/{{ simb }}/ {{ nombre_tablon }} - [VT!]</title>
</head>
<body>
	<header>
		<div>
			{% include "core/header_links.html" %}
		</div>
	</header>
	<hr>
	
	<br>
	
	<div class="alinear-contenedor">
		<div>
			<!-- Seccion para los banneres aleatorios -->
			<img src="{{ banner }}" alt="Banner no encontrado :(" height="120" width="220" loading="lazy" class="contorno-banner">
		</div>
		<br>
		<div>	
			<h1 class="fuente-alph">[/{{ simb }}/ {{ nombre_tablon }}]</h1>
		</div>
	</div>

	<br>

	<!-- Capas al div lo incluya dentro de la misma plantilla del formulario, en vez de tenerlo acá -->
	<!-- Formulario para postear -->
	<div class="alinear-contenedor">
		<div>
			{% include "posts/posting_form.html" with simbolo_data=simb %}
		</div>
	</div>
	<hr>

	<br>

	<!-- Lista de posteos -->
	{% include "posts/post_list.html" with post_list=post_data simbolo_data=simb %}
</body>
</html>
