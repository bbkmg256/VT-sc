[project]
name = "vomiting-things-prj"
version = "0.1.0"
description = "Proyecto de foro 4chan-like"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "configparser==7.2.0",
    "django==6.0.7",
    "django-minify-html==1.14.0",
    "django-stubs==6.0.7",
    "gunicorn==26.0.0",
    "pillow==12.3.0",
]

# Leer la documentación de la configuración de pyrefly
[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

# Ubicacion desde donde debe empezar a indexar dependencias o buscar directorios
# search-path = [".", "src"]
search-path = ["src"]


# Parece ser que esto no sute efecto
# Ubicación del codigo/logica del proyecto (Para el mapeado de modulos e importaciones locales)
# source-roots = ["src"]
