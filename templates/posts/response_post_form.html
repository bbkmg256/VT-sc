<form action="{% url 'response_posting_form' simbolo=simbolo_data id_post=id %}" method="POST">
	{% csrf_token %}
	<div>
		<!-- Segmento para referenciar un comentario -->
		<div class="alinear">
			<input type="text" size="15" name="id_respuesta_coment" placeholder="- ID comentario -" onkeydown="if(event.key === 'Enter') event.preventDefault();">
			<input type="submit" name="post_boton" value="Responder">
		</div>
			<!-- - Contenido - -->
		<div>
			<textarea rows="5" cols="30" name="contenido_post" placeholder="- Respuesta -"></textarea>	
		</div>
	</div>
</form>
